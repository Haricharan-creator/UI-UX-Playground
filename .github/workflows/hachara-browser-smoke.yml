name: HACHARA Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hachara-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-hachara-playwright-npm-v1
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/smoke.mjs
      - name: Run interaction smoke test
        run: node tests/interaction.mjs
