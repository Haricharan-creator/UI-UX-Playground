name: HACHARA Maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure runtime guards are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          markers = [
              '<script src="runtime-fix.js"></script>',
              '<script src="design-dna-runtime.js"></script>'
          ]
          anchor = '</head>'
          if anchor not in s:
              raise SystemExit('Could not find </head> insertion point.')
          for marker in markers:
              if marker not in s:
                  s = s.replace(anchor, f'{marker}\n{anchor}', 1)
          p.write_text(s, encoding='utf-8')
          print('Runtime guards loaded:', s != original)

      - name: Repair known runtime bootstrap issue
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          if 'const extra_topics = window.extra_topics || [];' not in s:
              s = s.replace(
                  'const topics=["Start From Zero"',
                  'const extra_topics = window.extra_topics || [];\nconst topics=["Start From Zero"',
                  1,
              )
          p.write_text(s, encoding='utf-8')
          print('Bootstrap repair changed:', s != original)

      - name: Validate HACHARA runtime markers
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<script src="runtime-fix.js"></script>',
              '<script src="design-dna-runtime.js"></script>',
              'const extra_topics = window.extra_topics || [];',
              'extra_topics.forEach(x=>topics.push(x));',
              'function go(id)',
              'function escapeHtml(s)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required runtime markers: ' + ', '.join(missing))
          runtime = Path('runtime-fix.js').read_text(encoding='utf-8')
          for marker in ['window.HACHARA_RUNTIME','uiuxPlaygroundUnifiedUXContext','design-review-flow-runtime.js']:
              if marker not in runtime:
                  raise SystemExit('runtime-fix.js is missing required marker: ' + marker)
          dna = Path('design-dna-runtime.js').read_text(encoding='utf-8')
          if 'window.HACHARA_DNA' not in dna or 'wireframeCanvas' not in dna or 'uiBuilderCanvas' not in dna:
              raise SystemExit('design-dna-runtime.js is missing required canvas bindings.')
          review = Path('design-review-flow-runtime.js').read_text(encoding='utf-8')
          for marker in ['window.HACHARA_REVIEW_FLOW','Finding → Correction → Before / After → Test','uiuxPlaygroundUnifiedUXContext','contextLabel']:
              if marker not in review:
                  raise SystemExit('design-review-flow-runtime.js is missing required marker: ' + marker)
          print('HACHARA runtime validation passed.')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check runtime-fix.js
          node --check design-dna-runtime.js
          node --check design-review-flow-runtime.js
          echo "HACHARA JavaScript syntax validation passed."

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load HACHARA Design DNA runtime"
          git push
