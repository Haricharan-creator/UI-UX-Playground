name: HACHARA Maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure runtime guards are loaded
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          markers = [
              '<script src="runtime-fix.js"></script>',
              '<script src="design-dna-runtime.js"></script>'
          ]
          anchor = '</head>'
          if anchor not in s:
              raise SystemExit('Could not find </head> insertion point.')
          for marker in markers:
              if marker not in s:
                  s = s.replace(anchor, f'{marker}\n{anchor}', 1)
          p.write_text(s, encoding='utf-8')
          print('Runtime guards loaded:', s != original)

      - name: Repair known runtime bootstrap issue
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          if 'const extra_topics = window.extra_topics || [];' not in s:
              s = s.replace(
                  'const topics=["Start From Zero"',
                  'const extra_topics = window.extra_topics || [];\nconst topics=["Start From Zero"',
                  1,
              )
          p.write_text(s, encoding='utf-8')
          print('Bootstrap repair changed:', s != original)

      - name: Integrate HACHARA UI preference and signature
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          style = '''
          <style>
          .hacharaUiSwitch{position:fixed;right:18px;top:12px;z-index:2000;display:flex;gap:7px;align-items:center}
          .hacharaUiSwitch a{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(16,20,38,.94);color:#fff;text-decoration:none;font:700 11px/1 Inter,system-ui,sans-serif;box-shadow:0 7px 18px rgba(0,0,0,.16)}
          .hacharaUiSwitch a:hover{background:#262d49}
          .hacharaClassicFooter{margin:28px 0 8px;padding:18px 4px 8px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:right}
          @media(max-width:720px){.hacharaUiSwitch{right:10px;top:8px}.hacharaUiSwitch a:last-child{display:none}.hacharaClassicFooter{justify-content:center;text-align:center}}
          </style>
'''
          if 'class="hacharaUiSwitch"' not in s and '</head>' in s:
              s = s.replace('</head>', style + '</head>', 1)

          switch = '<div class="hacharaUiSwitch"><a href="ui-options.html">🎨 Choose UI</a><a href="modern.html">Modern →</a></div>'
          if 'class="hacharaUiSwitch"' not in s and '<body>' in s:
              s = s.replace('<body>', '<body>\n' + switch, 1)

          footer = '<footer class="hacharaClassicFooter"><span>HACHARA · Learn · Think · Create · Grow</span></footer>\n'
          if 'class="hacharaClassicFooter"' not in s and '</body>' in s:
              s = s.replace('</body>', footer + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('UI preference/signature integration changed:', s != original)

      - name: Validate HACHARA runtime markers
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<script src="runtime-fix.js"></script>',
              '<script src="design-dna-runtime.js"></script>',
              'const extra_topics = window.extra_topics || [];',
              'extra_topics.forEach(x=>topics.push(x));',
              'function go(id)',
              'function escapeHtml(s)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required runtime markers: ' + ', '.join(missing))
          runtime = Path('runtime-fix.js').read_text(encoding='utf-8')
          for marker in ['window.HACHARA_RUNTIME','uiuxPlaygroundUnifiedUXContext','design-review-flow-runtime.js','project-workspace-runtime.js','ux-workflow-orchestrator.js']:
              if marker not in runtime:
                  raise SystemExit('runtime-fix.js is missing required marker: ' + marker)
          dna = Path('design-dna-runtime.js').read_text(encoding='utf-8')
          if 'window.HACHARA_DNA' not in dna or 'wireframeCanvas' not in dna or 'uiBuilderCanvas' not in dna:
              raise SystemExit('design-dna-runtime.js is missing required canvas bindings.')
          review = Path('design-review-flow-runtime.js').read_text(encoding='utf-8')
          if 'window.HACHARA_REVIEW_FLOW' not in review or 'Finding → Correction → Before / After → Test' not in review:
              raise SystemExit('design-review-flow-runtime.js is missing the review-flow runtime marker.')
          workspace = Path('project-workspace-runtime.js').read_text(encoding='utf-8')
          if 'window.HACHARA_WORKSPACE' not in workspace or 'Project Workspace' not in workspace or 'hacharaDesignReviewFlow' not in workspace:
              raise SystemExit('project-workspace-runtime.js is missing required workspace markers.')
          workflow = Path('ux-workflow-orchestrator.js').read_text(encoding='utf-8')
          if 'window.HACHARA_WORKFLOW' not in workflow or 'Recommended next workspace action' not in workflow:
              raise SystemExit('ux-workflow-orchestrator.js is missing required workflow markers.')
          print('HACHARA runtime validation passed.')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check runtime-fix.js
          node --check design-dna-runtime.js
          node --check design-review-flow-runtime.js
          node --check project-workspace-runtime.js
          node --check ux-workflow-orchestrator.js
          echo "HACHARA JavaScript syntax validation passed."

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate HACHARA UI preference and signature"
          git push
