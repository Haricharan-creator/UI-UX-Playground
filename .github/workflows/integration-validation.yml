name: HACHARA Integration Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hachara-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - parallel:
          - name: Validate integration contracts
            run: python3 scripts/validate_integration.py
          - name: Validate module practice evidence integration
            run: python3 scripts/validate_module_practice_evidence.py
          - name: Validate local page links
            run: python3 scripts/validate_links.py
          - name: Validate identifiers and cross-references
            run: python3 scripts/validate_ids.py
          - name: Validate HTML structure
            run: python3 scripts/validate_html_structure.py
          - name: Validate navigation contract
            run: python3 scripts/validate_navigation.py
          - name: Validate accessibility smoke checks
            run: python3 scripts/validate_accessibility.py
          - name: Validate form controls
            run: python3 scripts/validate_forms.py
          - name: Validate preservation and safety checks
            run: python3 scripts/validate_content_safety.py
